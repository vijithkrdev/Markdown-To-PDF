<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown → PDF</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/workspace.css">
  <link rel="stylesheet" href="css/preview-md.css">
  <link rel="stylesheet" href="css/preview-pdf.css">
  <link rel="stylesheet" href="css/modal.css">
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <span class="brand-name">Markdown <span>→</span> PDF</span>
    </div>
    <span class="status-tag" id="status">Ready</span>
    <button class="btn btn-ghost" id="btn-sample">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Sample
    </button>
    <button class="btn btn-ghost btn-danger" id="btn-clear">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      Clear
    </button>
    <button class="btn btn-primary" id="btn-download">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download PDF
    </button>
  </header>

  <!-- Workspace -->
  <div class="workspace">

    <!-- Left: Editor -->
    <div class="pane">
      <div class="pane-header">
        <span class="pane-label">Editor</span>
      </div>
      <textarea
        id="md-input"
        placeholder="# Start writing...&#10;&#10;Paste or type markdown here.&#10;The PDF preview shows real page breaks."
      ></textarea>
      <div class="editor-footer">
        <span id="wc">0 words</span>
        <span id="lc">0 lines</span>
        <span id="cc">0 chars</span>
      </div>
    </div>

    <!-- Right: Preview -->
    <div class="pane">
      <div class="pane-header">
        <span class="pane-label">Preview</span>
        <div class="toggle-pill">
          <button class="tab-btn active" id="tab-md">Markdown</button>
          <button class="tab-btn"        id="tab-pdf">PDF pages</button>
        </div>
      </div>
      <div class="preview-wrap">

        <!-- Markdown rendered -->
        <div class="preview-panel visible" id="md-preview">
          <div class="empty">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Markdown preview will appear here
          </div>
        </div>

        <!-- PDF paginated -->
        <div class="preview-panel" id="pdf-preview-panel">
          <div class="pdf-toolbar">
            <span class="pdf-info" id="pdf-info">A4 · Portrait · 14mm margins</span>
            <span class="pdf-page-count" id="pdf-page-count"></span>
          </div>
          <div class="pages-container" id="pages-container">
            <div class="pdf-page-sheet">
              <div class="pdf-content">
                <div class="empty empty-dim">
                  <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                  PDF page preview will appear here
                </div>
              </div>
              <span class="page-badge">1</span>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Export Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-title">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export PDF
      </div>

      <div class="opt-grid">
        <div class="opt-group">
          <label for="opt-format">Paper size</label>
          <select id="opt-format">
            <option value="a4" selected>A4</option>
            <option value="a3">A3</option>
            <option value="a5">A5</option>
            <option value="letter">Letter</option>
            <option value="legal">Legal</option>
          </select>
        </div>
        <div class="opt-group">
          <label for="opt-orient">Orientation</label>
          <select id="opt-orient">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div class="opt-group">
          <label for="opt-fontsize">Font size</label>
          <select id="opt-fontsize">
            <option value="11">11px — compact</option>
            <option value="12" selected>12px — default</option>
            <option value="13">13px — comfortable</option>
            <option value="14">14px — large</option>
          </select>
        </div>
        <div class="opt-group">
          <label for="opt-quality">Image quality</label>
          <select id="opt-quality">
            <option value="0.85">Normal</option>
            <option value="0.95" selected>High</option>
            <option value="1.0">Maximum</option>
          </select>
        </div>
      </div>

      <div class="opt-group mg-label-row">
        <label>Margins (mm)</label>
      </div>
      <div class="margin-row">
        <div><div class="mg-lbl">Top</div>    <input type="number" id="mg-top"    value="14" min="0" max="60"></div>
        <div><div class="mg-lbl">Right</div>  <input type="number" id="mg-right"  value="14" min="0" max="60"></div>
        <div><div class="mg-lbl">Bottom</div> <input type="number" id="mg-bottom" value="14" min="0" max="60"></div>
        <div><div class="mg-lbl">Left</div>   <input type="number" id="mg-left"   value="14" min="0" max="60"></div>
      </div>

      <div class="opt-group">
        <label for="opt-filename">Filename</label>
        <input type="text" id="opt-filename" value="document">
      </div>

      <div class="modal-actions">
        <button class="btn" id="btn-modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-modal-export">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
      </div>
    </div>
  </div>

  <!-- Libraries (local) -->
  <script src="lib/marked.min.js"></script>
  <script src="lib/html2pdf.bundle.min.js"></script>

  <!-- App scripts -->
  <script src="js/constants.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/paginator.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
