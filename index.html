<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown → PDF</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/topbar.css">
  <link rel="stylesheet" href="css/workspace.css">
  <link rel="stylesheet" href="css/preview-md.css">
  <link rel="stylesheet" href="css/preview-pdf.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/toolbar.css">
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <span class="brand-name">Markdown <span>→</span> PDF</span>
    </div>
    <span class="status-tag" id="status">Ready</span>
    <button class="btn btn-ghost" id="btn-sample">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span>Sample</span>
    </button>
    <button class="btn btn-ghost btn-danger" id="btn-clear">
      <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      <span>Clear</span>
    </button>
    <button class="btn btn-primary" id="btn-download">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Download PDF</span>
    </button>
  </header>

  <!-- Workspace -->
  <div class="workspace">

    <!-- Left: Editor -->
    <div class="pane">
      <div class="pane-header">
        <span class="pane-label">Editor</span>
      </div>

      <!-- Formatting toolbar -->
      <div class="editor-toolbar" id="editor-toolbar">
        <!-- Headings -->
        <div class="tb-group">
          <button class="tb-btn" data-action="h1" title="Heading 1">H1</button>
          <button class="tb-btn" data-action="h2" title="Heading 2">H2</button>
          <button class="tb-btn" data-action="h3" title="Heading 3">H3</button>
          <button class="tb-btn" data-action="h4" title="Heading 4">H4</button>
        </div>
        <span class="tb-sep"></span>
        <!-- Inline formatting -->
        <div class="tb-group">
          <button class="tb-btn" data-action="bold" title="Bold (Ctrl+B)">
            <svg viewBox="0 0 24 24"><path d="M6 4h8a4 4 0 0 1 0 8H6z"/><path d="M6 12h9a4 4 0 0 1 0 8H6z"/></svg>
          </button>
          <button class="tb-btn" data-action="italic" title="Italic (Ctrl+I)">
            <svg viewBox="0 0 24 24"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
          </button>
          <button class="tb-btn" data-action="strikethrough" title="Strikethrough">
            <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12" stroke-width="2.5"/><path d="M16.3 6.5A3.5 3.5 0 0 0 12 4C9.5 4 8 5.5 8 7.5c0 1.5 1 2.5 4 3"/><path d="M7.7 17.5A3.5 3.5 0 0 0 12 20c2.5 0 4-1.5 4-3.5 0-1.5-1-2.5-4-3"/></svg>
          </button>
          <button class="tb-btn" data-action="code" title="Inline code">
            <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </button>
        </div>
        <span class="tb-sep"></span>
        <!-- Block elements -->
        <div class="tb-group">
          <button class="tb-btn" data-action="codeblock" title="Code block">
            <svg viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          </button>
          <button class="tb-btn" data-action="quote" title="Blockquote">
            <svg viewBox="0 0 24 24"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z"/></svg>
          </button>
          <button class="tb-btn" data-action="ul" title="Unordered list">
            <svg viewBox="0 0 24 24"><line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><circle cx="4" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
          </button>
          <button class="tb-btn" data-action="ol" title="Ordered list">
            <svg viewBox="0 0 24 24"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4" fill="none"/><path d="M4 10h2" fill="none"/><path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1" fill="none"/></svg>
          </button>
        </div>
        <span class="tb-sep"></span>
        <!-- Inserts -->
        <div class="tb-group">
          <button class="tb-btn" data-action="link" title="Link (Ctrl+K)">
            <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </button>
          <button class="tb-btn" data-action="hr" title="Horizontal rule">
            <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke-width="3"/></svg>
          </button>
          <button class="tb-btn" data-action="pagebreak" title="Insert page break">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="6" y1="13" x2="18" y2="13" stroke-dasharray="2 2"/></svg>
          </button>
          <button class="tb-btn" data-action="table" title="Insert table">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="9" x2="9" y2="21"/><line x1="15" y1="9" x2="15" y2="21"/></svg>
          </button>
        </div>
      </div>

      <textarea
        id="md-input"
        placeholder="# Start writing...&#10;&#10;Paste or type markdown here.&#10;The PDF preview shows real page breaks."
      ></textarea>
      <div class="editor-footer">
        <span id="wc">0 words</span>
        <span id="lc">0 lines</span>
        <span id="cc">0 chars</span>
      </div>
    </div>

    <!-- Right: Preview -->
    <div class="pane" id="preview-pane">
      <div class="pane-header">
        <span class="pane-label">Preview</span>
        <div class="toggle-pill">
          <button class="tab-btn active" id="tab-md">Markdown</button>
          <button class="tab-btn"        id="tab-pdf">PDF pages</button>
        </div>
        <button class="btn-icon" id="btn-fullscreen" title="Fullscreen preview">
          <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
      </div>
      <div class="preview-wrap">

        <!-- Markdown rendered -->
        <div class="preview-panel visible" id="md-preview">
          <div class="empty">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Markdown preview will appear here
          </div>
        </div>

        <!-- PDF paginated -->
        <div class="preview-panel" id="pdf-preview-panel">
          <div class="pdf-toolbar">
            <span class="pdf-info" id="pdf-info">A4 · Portrait · 14mm margins</span>
            <span class="pdf-page-count" id="pdf-page-count"></span>
          </div>
          <div class="pages-container" id="pages-container">
            <div class="pdf-page-sheet">
              <div class="pdf-content">
                <div class="empty empty-dim">
                  <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
                  PDF page preview will appear here
                </div>
              </div>
              <span class="page-badge">1</span>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <span>Built by</span>
    <a href="https://github.com/vijithkrdev" target="_blank" rel="noopener" class="footer-link">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.02 10.02 0 0 0 22 12.017C22 6.484 17.522 2 12 2z"/></svg>
      vijithkrdev
    </a>
  </footer>

  <!-- Export Modal -->
  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <div class="modal-title">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export PDF
      </div>

      <div class="opt-grid">
        <div class="opt-group">
          <label for="opt-format">Paper size</label>
          <select id="opt-format">
            <option value="a4" selected>A4</option>
            <option value="a3">A3</option>
            <option value="a5">A5</option>
            <option value="letter">Letter</option>
            <option value="legal">Legal</option>
          </select>
        </div>
        <div class="opt-group">
          <label for="opt-orient">Orientation</label>
          <select id="opt-orient">
            <option value="portrait" selected>Portrait</option>
            <option value="landscape">Landscape</option>
          </select>
        </div>
        <div class="opt-group">
          <label for="opt-fontsize">Font size</label>
          <select id="opt-fontsize">
            <option value="11">11px — compact</option>
            <option value="12" selected>12px — default</option>
            <option value="13">13px — comfortable</option>
            <option value="14">14px — large</option>
          </select>
        </div>
        <div class="opt-group">
          <label for="opt-quality">Image quality</label>
          <select id="opt-quality">
            <option value="0.85">Normal</option>
            <option value="0.95" selected>High</option>
            <option value="1.0">Maximum</option>
          </select>
        </div>
      </div>

      <div class="opt-group mg-label-row">
        <label>Margins (mm)</label>
      </div>
      <div class="margin-row">
        <div><div class="mg-lbl">Top</div>    <input type="number" id="mg-top"    value="14" min="0" max="60"></div>
        <div><div class="mg-lbl">Right</div>  <input type="number" id="mg-right"  value="14" min="0" max="60"></div>
        <div><div class="mg-lbl">Bottom</div> <input type="number" id="mg-bottom" value="14" min="0" max="60"></div>
        <div><div class="mg-lbl">Left</div>   <input type="number" id="mg-left"   value="14" min="0" max="60"></div>
      </div>

      <div class="opt-group">
        <label for="opt-filename">Filename</label>
        <input type="text" id="opt-filename" value="document">
      </div>

      <div class="modal-actions">
        <button class="btn" id="btn-modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="btn-modal-export">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
      </div>
    </div>
  </div>

  <!-- Libraries (local) -->
  <script src="lib/marked.min.js"></script>
  <script src="lib/html2pdf.bundle.min.js"></script>

  <!-- App scripts -->
  <script src="js/constants.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/paginator.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/toolbar.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
